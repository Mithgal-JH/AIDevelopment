<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthy ChatBot — مساعدك الصحي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-2: #243044;
      --accent: #2dd4bf;
      --accent-dim: rgba(45, 212, 191, 0.15);
      --warm: #fbbf24;
      --warm-dim: rgba(251, 191, 36, 0.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --radius: 16px;
      --radius-sm: 10px;
      --font: "Cairo", ui-sans-serif, system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(45, 212, 191, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(251, 191, 36, 0.06), transparent);
    }

    .header {
      padding: 1.25rem 1.5rem;
      text-align: center;
      background: rgba(26, 35, 50, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p { margin: 0; color: var(--muted); font-size: 0.9rem; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      width: min(680px, 100%);
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      overflow: hidden;
    }

    .card__head {
      padding: 1.25rem 1.5rem;
      background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card__head h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .card__head small { display: block; margin-top: 0.3rem; color: var(--muted); font-size: 0.85rem; }

    #chat {
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      height: 340px;
      overflow-y: auto;
      overflow-anchor: auto;
      contain: layout style;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 0.65rem;
      max-width: 88%;
      align-items: flex-start;
      animation: msgIn 0.35s ease-out;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user { margin-left: auto; justify-content: flex-end; }
    .msg.bot { margin-right: auto; justify-content: flex-start; }

    .bubble {
      padding: 0.8rem 1.1rem;
      border-radius: 1.1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.95rem;
    }

    .bubble.bot {
      background: var(--accent-dim);
      border: 1px solid rgba(45, 212, 191, 0.25);
      color: #99f6e4;
    }

    .bubble.user {
      background: var(--warm-dim);
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: #fde68a;
    }

    .bubble.typing {
      padding: 0.9rem 1.3rem;
    }

    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 2px;
      animation: bounce 1.4s ease-in-out infinite both;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.6; }
      40% { transform: scale(1); opacity: 1; }
    }

    .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .chip {
      padding: 0.5rem 0.9rem;
      font-size: 0.85rem;
      font-family: var(--font);
      border-radius: 999px;
      border: 1px solid rgba(45, 212, 191, 0.35);
      background: rgba(45, 212, 191, 0.08);
      color: var(--accent);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .chip:hover {
      background: rgba(45, 212, 191, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(45, 212, 191, 0.2);
    }

    .chip:active { transform: translateY(0); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      background: var(--surface-2);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    #userInput {
      padding: 0.85rem 1.1rem;
      font-size: 1rem;
      font-family: var(--font);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #userInput::placeholder { color: var(--muted); }
    #userInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.2);
    }

    .btn-send {
      padding: 0.85rem 1.35rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #14b8a6);
      color: #0f1419;
      font-weight: 700;
      font-family: var(--font);
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }

    .btn-send:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(45, 212, 191, 0.35);
    }

    .btn-send:active { transform: translateY(0); }
    .btn-send:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 1.4rem; }
      #chat { height: 280px; }
      .msg { max-width: 95%; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Healthy ChatBot</h1>
    <p>مساعد صحي عام — لا يغني عن استشارة الطبيب</p>
    <div class="status" aria-live="polite">متصل</div>
  </header>

  <main>
    <section class="card" aria-label="المحادثة">
      <div class="card__head">
        <h2>ابدأ المحادثة</h2>
        <small>اكتب سؤالك أو اختر أحد الاقتراحات أدناه.</small>
      </div>

      <div id="chat" role="log" aria-live="polite"></div>

      <div class="chips" id="chips" aria-label="اقتراحات سريعة">
        <button type="button" class="chip" data-msg="عندي صداع">عندي صداع</button>
        <button type="button" class="chip" data-msg="كيف أخفض الحرارة">كيف أخفض الحرارة</button>
        <button type="button" class="chip" data-msg="هل أحتاج زيارة الطبيب">هل أحتاج زيارة الطبيب</button>
        <button type="button" class="chip" data-msg="مرحبا">مرحبا</button>
      </div>

      <form id="form" class="form-row" aria-label="إرسال رسالة">
        <input id="userInput" type="text" placeholder="اكتب هنا..." autocomplete="off" aria-label="نص الرسالة" />
        <button type="submit" class="btn-send" id="btnSend">إرسال</button>
      </form>
    </section>
  </main>

  <footer>يعمل بالكامل في المتصفح — لا يرسل بيانات إلى أي خادم.</footer>

  <script>
    (function () {
      "use strict";

      const PATTERNS = [
        ["Emergency", /(لا أستطيع التنفس|ألم شديد في الصدر|نزيف حاد|هناك نزيف شديد)/i],
        ["SymptomCheck", /(لدي صداع|عندي صداع|أعاني من صداع|ألم في الحلق|حلقي يؤلمني|عندي سعال|أعاني من سعال|أشعر بدوخة|لدي دوخة|ألم في المعدة)/i],
        ["MedicationAdvice", /(ما الدواء المناسب|ما الدواء الذي أتناوله|هل أستطيع أخذ باراسيتامول|هل يمكنني تناول دواء|ما الجرعة المناسبة|كم الجرعة المناسبة)/i],
        ["FeverConcern", /(حرارتي\s*\d+|درجة الحرارة\s*\d+|كيف أخفض الحرارة|ارتفاع الحرارة)/i],
        ["DoctorVisit", /(متى أزور الطبيب|هل يجب أن أزور الطبيب|هل حالتي خطيرة|هل أحتاج فحص|هل يجب أن أذهب للطبيب)/i],
        ["DiseaseInfo", /(ما أعراض الإنفلونزا|أخبرني عن الإنفلونزا|أخبرني عن السكري|ما أعراض السكري|ما أسباب الربو|أخبرني عن الربو)/i],
        ["Greeting", /(مرحبا|أهلا|اهلا|السلام عليكم|مساء الخير|صباح الخير|مرحبا بك)/i],
      ];

      const RESPONSES = {
        SymptomCheck: [
          "يبدو أنك تعاني من بعض الأعراض. حاول الراحة وشرب السوائل، وإذا استمرت الأعراض راجع الطبيب.",
          "قد تكون هذه أعراض مرض بسيط، لكن إذا استمرت لفترة طويلة فمن الأفضل استشارة الطبيب.",
          "أنصحك بالراحة ومراقبة الأعراض، وإذا ساءت الحالة يفضل زيارة الطبيب.",
        ],
        MedicationAdvice: [
          "لا يمكنني وصف دواء بدقة، لكن يمكنك استشارة الصيدلي لمعرفة الدواء المناسب.",
          "يفضل عدم تناول أي دواء بدون استشارة طبيب أو صيدلي.",
          "تأكد دائماً من استشارة مختص قبل تناول أي دواء.",
        ],
        FeverConcern: [
          "إذا كانت الحرارة مرتفعة حاول شرب السوائل واستخدام خافض حرارة مثل الباراسيتامول.",
          "الحرارة المرتفعة قد تكون بسبب عدوى، راقبها وإذا استمرت استشر الطبيب.",
          "إذا تجاوزت الحرارة 39 درجة لفترة طويلة يفضل مراجعة الطبيب.",
        ],
        DoctorVisit: [
          "إذا استمرت الأعراض أو كانت شديدة فمن الأفضل زيارة الطبيب.",
          "زيارة الطبيب تساعد في الحصول على تشخيص دقيق للحالة.",
          "إذا شعرت أن الأعراض تزداد سوءاً فمن الأفضل مراجعة الطبيب.",
        ],
        DiseaseInfo: [
          "يمكنني إعطاؤك معلومات عامة عن المرض، لكن التشخيص يحتاج إلى طبيب.",
          "المعلومات الطبية مهمة، لكن التشخيص الصحيح يتم فقط من خلال الطبيب.",
        ],
        Emergency: [
          "⚠️ هذه حالة طارئة! يجب طلب المساعدة الطبية فوراً.",
          "⚠️ يرجى الاتصال بالإسعاف أو التوجه إلى أقرب مستشفى فوراً.",
        ],
        Greeting: [
          "مرحباً! أنا البوت الطبي، كيف يمكنني مساعدتك؟",
          "أهلاً بك! يمكنك سؤالي عن الأعراض أو الأمراض.",
          "مرحباً، أتمنى لك الصحة. كيف أستطيع مساعدتك؟",
        ],
        Unknown: [
          "لم أفهم سؤالك الطبي، هل يمكنك توضيحه أكثر؟",
          "عذراً، لم أتمكن من فهم السؤال. حاول صياغته بطريقة أخرى.",
          "يمكنك سؤالي عن الأعراض أو الأمراض أو الأدوية.",
        ],
      };

      const chat = document.getElementById("chat");
      const input = document.getElementById("userInput");
      const form = document.getElementById("form");
      const btnSend = document.getElementById("btnSend");
      const chips = document.getElementById("chips");

      function detectIntent(text) {
        for (let i = 0; i < PATTERNS.length; i++) {
          if (PATTERNS[i][1].test(text)) return PATTERNS[i][0];
        }
        return "Unknown";
      }

      function getReply(text) {
        const intent = detectIntent(text);
        const list = RESPONSES[intent] || RESPONSES.Unknown;
        return { reply: list[Math.floor(Math.random() * list.length)], intent };
      }

      function appendMessage(text, role, skipAnimation) {
        const frag = document.createDocumentFragment();
        const msg = document.createElement("div");
        msg.className = "msg " + role;
        if (skipAnimation) msg.style.animation = "none";

        const bubble = document.createElement("div");
        bubble.className = "bubble " + role;
        bubble.textContent = text;

        if (role === "bot") {
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = "Healthy ChatBot";
          msg.appendChild(meta);
        }
        msg.appendChild(bubble);
        frag.appendChild(msg);
        chat.appendChild(frag);
        requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; });
      }

      function showTyping() {
        const frag = document.createDocumentFragment();
        const msg = document.createElement("div");
        msg.className = "msg bot";
        msg.setAttribute("data-typing", "1");
        const bubble = document.createElement("div");
        bubble.className = "bubble bot typing";
        bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
        msg.appendChild(bubble);
        frag.appendChild(msg);
        chat.appendChild(frag);
        requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; });
      }

      function removeTyping() {
        const el = chat.querySelector("[data-typing='1']");
        if (el) el.remove();
      }

      function sendUserMessage(text) {
        if (!text || !text.trim()) return;
        const t = text.trim();
        appendMessage(t, "user");
        input.value = "";

        btnSend.disabled = true;
        showTyping();

        setTimeout(function () {
          removeTyping();
          const { reply } = getReply(t);
          appendMessage(reply, "bot");
          btnSend.disabled = false;
          input.focus();
        }, 600 + Math.min(t.length * 25, 400));
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        sendUserMessage(input.value);
      });

      chips.addEventListener("click", function (e) {
        const btn = e.target.closest(".chip");
        if (btn && btn.dataset.msg) sendUserMessage(btn.dataset.msg);
      });

      appendMessage("مرحباً! كيف يمكنني مساعدتك اليوم؟", "bot", true);
      input.focus();
    })();
  </script>
</body>
</html>
