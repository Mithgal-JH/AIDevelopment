<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPU Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESET & BASE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy-deep:   #071e3d;
  --navy:        #0d2d5e;
  --blue:        #1557a0;
  --blue-mid:    #1e72cc;
  --blue-light:  #3d9be8;
  --ice:         #e8f3fd;
  --gold:        #f0b429;
  --gold-dim:    #c4911f;
  --white:       #ffffff;
  --glass-bg:    rgba(255,255,255,0.08);
  --glass-bdr:   rgba(255,255,255,0.16);
  --surface:     #f7fafd;
  --surface2:    #edf3fb;
  --text-dark:   #0d1f3c;
  --text-mid:    #4a6080;
  --text-mute:   #8fa3be;
  --bubble-user-a: #1557a0;
  --bubble-user-b: #3d9be8;
  --shadow-deep: 0 32px 80px rgba(7,30,61,0.28), 0 8px 24px rgba(7,30,61,0.16);
  --shadow-btn:  0 8px 28px rgba(21,87,160,0.50);
  --r-widget:    24px;
  --r-bubble:    18px;
}

body {
  font-family: 'Cairo', sans-serif;
  /* ── demo backdrop — remove when embedding ── */
  min-height: 100vh;
  background: #0a1628;
  background-image:
    radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(29,84,180,0.35) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 85%,  rgba(13,45,94,0.50)  0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 60% 30%,  rgba(61,155,232,0.12) 0%, transparent 50%);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

/* ── decorative orbs on demo page ── */
body::before, body::after {
  content: '';
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
}
body::before {
  width: 520px; height: 520px;
  top: -140px; right: -140px;
  background: radial-gradient(circle, rgba(30,114,204,0.18) 0%, transparent 70%);
  animation: orb-float 12s ease-in-out infinite;
}
body::after {
  width: 400px; height: 400px;
  bottom: -100px; left: -100px;
  background: radial-gradient(circle, rgba(13,45,94,0.22) 0%, transparent 70%);
  animation: orb-float 16s ease-in-out infinite reverse;
}
@keyframes orb-float {
  0%, 100% { transform: translate(0,0) scale(1);       }
  33%       { transform: translate(20px,-30px) scale(1.06); }
  66%       { transform: translate(-15px,20px) scale(0.96); }
}

.demo-label {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  color: rgba(255,255,255,0.07); font-size: clamp(2rem, 6vw, 5rem);
  font-weight: 900; letter-spacing: 0.06em; white-space: nowrap;
  pointer-events: none; user-select: none; z-index: 0;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   FLOATING TRIGGER BUTTON
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#fab {
  position: fixed;
  bottom: 30px; left: 30px;   /* RTL-friendly left = visual right in RTL */
  width: 64px; height: 64px;
  border-radius: 50%; border: none; cursor: pointer; outline: none;
  background: linear-gradient(145deg, var(--blue-mid), var(--navy-deep));
  box-shadow: var(--shadow-btn);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1),
              box-shadow 0.3s ease;
}
#fab:hover {
  transform: scale(1.12) translateY(-3px);
  box-shadow: 0 14px 40px rgba(21,87,160,0.65);
}
#fab:active { transform: scale(0.94); }

/* rings */
#fab::before, #fab::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid rgba(61,155,232,0.40);
  animation: fab-ring 2.8s ease-out infinite;
}
#fab::after { animation-delay: 1.4s; }
@keyframes fab-ring {
  0%   { transform: scale(1);    opacity: 0.8; }
  100% { transform: scale(1.85); opacity: 0;   }
}

/* icon swap */
.fab-icon { position: absolute; transition: all 0.28s cubic-bezier(.4,0,.2,1); }
#fab .ico-open  { opacity: 1;  transform: scale(1)   rotate(0deg);   }
#fab .ico-close { opacity: 0;  transform: scale(0.4) rotate(-120deg); }
#fab.active .ico-open  { opacity: 0;  transform: scale(0.4) rotate(120deg); }
#fab.active .ico-close { opacity: 1;  transform: scale(1)   rotate(0deg);   }

/* gold badge */
#fab-badge {
  position: absolute; top: 0; right: 0;
  min-width: 20px; height: 20px; padding: 0 5px;
  background: var(--gold);
  border: 2.5px solid #0a1628;
  border-radius: 10px;
  font-size: 0.62rem; font-weight: 700; color: var(--navy-deep);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.2s;
}
#fab-badge.hide { transform: scale(0); opacity: 0; pointer-events: none; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   WIDGET SHELL
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#widget {
  position: fixed;
  bottom: 110px; left: 30px;
  width: 380px; height: 580px;
  border-radius: var(--r-widget);
  overflow: hidden;
  display: flex; flex-direction: column;
  z-index: 9999;
  box-shadow: var(--shadow-deep);
  border: 1px solid rgba(255,255,255,0.10);

  /* closed */
  opacity: 0;
  transform: translateY(24px) scale(0.92);
  transform-origin: bottom left;
  pointer-events: none;
  transition: opacity 0.32s cubic-bezier(.4,0,.2,1),
              transform 0.36s cubic-bezier(.34,1.28,.64,1);
}
#widget.open {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: all;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   HEADER
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.w-head {
  position: relative;
  flex-shrink: 0;
  padding: 18px 18px 16px;
  background: linear-gradient(140deg, var(--navy-deep) 0%, #0e3a7a 55%, #174fa0 100%);
  display: flex; align-items: center; gap: 13px;
  overflow: hidden;
}

/* decorative geometry in header */
.w-head::before {
  content: ''; position: absolute;
  width: 220px; height: 220px; border-radius: 50%;
  top: -100px; right: -60px;
  background: radial-gradient(circle, rgba(61,155,232,0.18) 0%, transparent 70%);
}
.w-head::after {
  content: ''; position: absolute;
  width: 120px; height: 120px; border-radius: 50%;
  bottom: -60px; left: 30px;
  background: radial-gradient(circle, rgba(240,180,41,0.12) 0%, transparent 70%);
}

.head-avatar {
  position: relative; flex-shrink: 0; z-index: 1;
  width: 46px; height: 46px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
  border: 1px solid rgba(255,255,255,0.22);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

.head-info { flex: 1; z-index: 1; }
.head-info h2 {
  font-size: 0.9rem; font-weight: 700; color: #fff;
  line-height: 1.3; letter-spacing: 0.1px;
}
.head-info p {
  font-size: 0.70rem; color: rgba(255,255,255,0.58);
  margin-top: 2px; font-weight: 400;
}

.head-status {
  z-index: 1; display: flex; align-items: center; gap: 6px;
  margin-right: auto; flex-shrink: 0;
  font-size: 0.68rem; color: rgba(255,255,255,0.55);
}
.status-pip {
  width: 8px; height: 8px; border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 0 rgba(34,197,94,0.5);
  animation: pip-beat 2.2s ease-in-out infinite;
}
@keyframes pip-beat {
  0%,100% { box-shadow: 0 0 0 0   rgba(34,197,94,0.5); }
  50%      { box-shadow: 0 0 0 6px rgba(34,197,94,0);   }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MESSAGES AREA
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.w-body {
  flex: 1; overflow-y: auto;
  padding: 18px 14px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--surface);
  background-image:
    radial-gradient(ellipse 70% 50% at 85% 15%, rgba(21,87,160,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 15% 80%, rgba(61,155,232,0.05) 0%, transparent 60%);
  scroll-behavior: smooth;
}
.w-body::-webkit-scrollbar { width: 3px; }
.w-body::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--blue-light), var(--blue));
  border-radius: 3px;
}

/* ── welcome card ── */
.welcome-card {
  background: linear-gradient(135deg, rgba(21,87,160,0.08), rgba(61,155,232,0.06));
  border: 1px solid rgba(21,87,160,0.14);
  border-radius: 16px;
  padding: 14px 16px;
  text-align: center;
  animation: popIn 0.45s cubic-bezier(.34,1.56,.64,1) both;
}
.welcome-card .wc-icon { font-size: 2rem; display: block; margin-bottom: 6px; }
.welcome-card p {
  font-size: 0.78rem; color: var(--text-mid); line-height: 1.6; font-weight: 500;
}

/* ── chips ── */
.chips-row {
  display: flex; flex-wrap: wrap; gap: 7px;
  justify-content: center;
  animation: popIn 0.45s 0.1s cubic-bezier(.34,1.56,.64,1) both;
}
.chip {
  background: var(--white);
  border: 1.5px solid rgba(21,87,160,0.22);
  color: var(--blue); font-family: 'Cairo', sans-serif;
  font-size: 0.73rem; font-weight: 600;
  padding: 6px 13px; border-radius: 20px; cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 2px 8px rgba(21,87,160,0.08);
}
.chip:hover {
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  color: #fff; border-color: transparent;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(21,87,160,0.30);
}

/* ── date divider ── */
.date-sep {
  display: flex; align-items: center; gap: 10px;
  color: var(--text-mute); font-size: 0.66rem; font-weight: 500;
}
.date-sep::before, .date-sep::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(21,87,160,0.18), transparent);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MESSAGES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  animation: msgSlide 0.3s cubic-bezier(.34,1.4,.64,1) both;
}
.msg-row.user { flex-direction: row-reverse; }
.msg-row.bot  { flex-direction: row; }

@keyframes msgSlide {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0)    scale(1);    }
}

/* avatar */
.msg-av {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.msg-row.bot  .msg-av {
  background: linear-gradient(135deg, var(--navy), var(--blue-mid));
  box-shadow: 0 3px 10px rgba(13,45,94,0.30);
}
.msg-row.user .msg-av {
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  box-shadow: 0 3px 10px rgba(196,145,31,0.35);
}

/* bubble wrapper */
.msg-col { display: flex; flex-direction: column; max-width: 75%; gap: 3px; }

/* bubble */
.bubble {
  padding: 10px 15px;
  font-size: 0.86rem; line-height: 1.65;
  word-break: break-word; white-space: pre-line;
  position: relative;
}

/* bot bubble */
.msg-row.bot .bubble {
  background: var(--white);
  color: var(--text-dark);
  border-radius: var(--r-bubble) var(--r-bubble) var(--r-bubble) 6px;
  box-shadow: 0 2px 12px rgba(13,45,94,0.09), 0 1px 3px rgba(13,45,94,0.06);
  border: 1px solid rgba(13,45,94,0.07);
}

/* user bubble — glossy gradient */
.msg-row.user .bubble {
  background: linear-gradient(145deg, var(--bubble-user-a), var(--bubble-user-b));
  color: #fff;
  border-radius: var(--r-bubble) var(--r-bubble) 6px var(--r-bubble);
  box-shadow: 0 4px 18px rgba(21,87,160,0.40);
}
/* subtle inner shine */
.msg-row.user .bubble::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(160deg, rgba(255,255,255,0.14) 0%, transparent 55%);
  pointer-events: none;
}

/* timestamp */
.msg-time {
  font-size: 0.62rem; color: var(--text-mute);
  padding: 0 4px;
}
.msg-row.user .msg-time { text-align: left; }
.msg-row.bot  .msg-time { text-align: right; }

/* delivery tick */
.msg-row.user .msg-time::after {
  content: ' ✓✓'; color: var(--blue-light); font-size: 0.60rem;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TYPING INDICATOR
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.typing-row { display: flex; align-items: flex-end; gap: 8px; }
.typing-bubble {
  background: var(--white);
  border: 1px solid rgba(13,45,94,0.07);
  border-radius: var(--r-bubble) var(--r-bubble) var(--r-bubble) 6px;
  padding: 11px 16px;
  box-shadow: 0 2px 12px rgba(13,45,94,0.09);
  display: flex; align-items: center; gap: 5px;
}
.typing-bubble span {
  width: 7px; height: 7px; border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  animation: dot-bounce 1.3s ease-in-out infinite;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
@keyframes dot-bounce {
  0%,60%,100% { transform: translateY(0) scale(0.8); opacity: 0.4; }
  30%         { transform: translateY(-6px) scale(1); opacity: 1; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   INPUT BAR
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.w-foot {
  flex-shrink: 0;
  padding: 12px 12px;
  background: var(--white);
  border-top: 1px solid rgba(13,45,94,0.08);
  display: flex; align-items: center; gap: 9px;
}

#msgInput {
  flex: 1;
  padding: 11px 17px;
  border: 1.5px solid rgba(21,87,160,0.18);
  border-radius: 26px;
  font-family: 'Cairo', sans-serif;
  font-size: 0.88rem;
  color: var(--text-dark);
  background: var(--surface2);
  outline: none; direction: rtl;
  transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
}
#msgInput:focus {
  border-color: var(--blue-mid);
  background: var(--white);
  box-shadow: 0 0 0 3.5px rgba(30,114,204,0.14);
}
#msgInput::placeholder { color: var(--text-mute); font-weight: 400; }

#sendBtn {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  border: none; cursor: pointer; outline: none;
  background: linear-gradient(145deg, var(--blue-mid), var(--navy));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(21,87,160,0.40);
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1),
              box-shadow 0.2s ease, opacity 0.2s;
}
#sendBtn:hover:not(:disabled) {
  transform: scale(1.10) translateY(-1px);
  box-shadow: 0 8px 22px rgba(21,87,160,0.52);
}
#sendBtn:active:not(:disabled) { transform: scale(0.92); }
#sendBtn:disabled { opacity: 0.40; cursor: not-allowed; transform: none; }
#sendBtn svg { width: 18px; height: 18px; }

/* ── mic button ── */
#micBtn {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid rgba(21,87,160,0.20);
  background: var(--white); cursor: pointer; outline: none;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease; color: var(--text-mute);
}
#micBtn:hover { background: var(--surface2); color: var(--blue-mid); border-color: var(--blue-mid); }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SHARED KEYFRAMES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@keyframes popIn {
  from { opacity: 0; transform: scale(0.88) translateY(10px); }
  to   { opacity: 1; transform: scale(1)    translateY(0);    }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESPONSIVE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media (max-width: 460px) {
  #widget { width: calc(100vw - 16px); left: 8px; bottom: 98px; height: 72vh; }
  #fab    { left: 16px; bottom: 16px; }
}

  </style>
</head>
<body>

<div class="demo-label">PPU</div>

<!-- ══════════════════════════════════════════════════
     FAB — Floating Action Button
══════════════════════════════════════════════════ -->
<button id="fab" aria-label="فتح الدردشة">
  <div id="fab-badge">1</div>

  <!-- chat icon -->
  <span class="fab-icon ico-open">
    <svg width="27" height="27" viewBox="0 0 24 24" fill="none"
         stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      <path d="M8 10h.01M12 10h.01M16 10h.01" stroke-width="2.2"/>
    </svg>
  </span>

  <!-- close icon -->
  <span class="fab-icon ico-close">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
         stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6"  y2="18"/>
      <line x1="6"  y1="6" x2="18" y2="18"/>
    </svg>
  </span>
</button>

<!-- ══════════════════════════════════════════════════
     WIDGET
══════════════════════════════════════════════════ -->
<div id="widget">

  <!-- Header -->
  <div class="w-head">
    <div class="head-avatar">🎓</div>
    <div class="head-info">
      <h2>بوت جامعة بوليتكنك فلسطين 🎓</h2>
      <p>اسأل عن المواد والقوانين الجامعية</p>
    </div>
    <div class="head-status">
      <div class="status-pip"></div>
      متصل
    </div>
  </div>

  <!-- Messages -->
  <div class="w-body" id="wBody">

    <div class="welcome-card">
      <span class="wc-icon">👋</span>
      <p>أهلاً بك! أنا المساعد الذكي لجامعة بوليتكنك فلسطين.<br>كيف يمكنني مساعدتك اليوم؟</p>
    </div>

    <div class="chips-row" id="chips">
      <button class="chip" onclick="useChip(this)">كم عدد الغيابات؟</button>
      <button class="chip" onclick="useChip(this)">نظام العلامات</button>
      <button class="chip" onclick="useChip(this)">قوانين الجامعة</button>
      <button class="chip" onclick="useChip(this)">ماذا لو رسبت؟</button>
      <button class="chip" onclick="useChip(this)">هل الحضور إجباري؟</button>
    </div>

    <div class="date-sep">اليوم</div>

  </div>

  <!-- Input -->
  <div class="w-foot">
    <input id="msgInput" type="text" placeholder="اكتب رسالتك…"
           autocomplete="off" onkeydown="if(event.key==='Enter') doSend()" />
    <button id="micBtn" title="صوت" tabindex="-1">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
      </svg>
    </button>
    <button id="sendBtn" onclick="doSend()" title="إرسال">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff"
           stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<!-- ══════════════════════════════════════════════════
     JAVASCRIPT
══════════════════════════════════════════════════ -->
<script>
  const RASA_URL = 'http://127.0.0.1:5005/webhooks/rest/webhook';

  const fab     = document.getElementById('fab');
  const widget  = document.getElementById('widget');
  const wBody   = document.getElementById('wBody');
  const input   = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const badge   = document.getElementById('fab-badge');
  const chips   = document.getElementById('chips');

  /* ── Toggle ─────────────────────────────────────── */
  fab.addEventListener('click', () => {
    const now = widget.classList.toggle('open');
    fab.classList.toggle('active', now);
    badge.classList.add('hide');
    if (now) { scrollDown(); setTimeout(() => input.focus(), 320); }
  });

  /* ── Helpers ─────────────────────────────────────── */
  function scrollDown() {
    wBody.scrollTo({ top: wBody.scrollHeight, behavior: 'smooth' });
  }

  function now() {
    return new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  }

  function killChips() {
    if (chips) chips.remove();
  }

  /* ── Append message ──────────────────────────────── */
  function pushMsg(text, who) {
    const row  = document.createElement('div');
    row.className = `msg-row ${who}`;

    const av = document.createElement('div');
    av.className = 'msg-av';
    av.textContent = who === 'user' ? '👤' : '🤖';

    const col  = document.createElement('div');
    col.className = 'msg-col';

    const bub  = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;

    const ts   = document.createElement('div');
    ts.className = 'msg-time';
    ts.textContent = now();

    col.appendChild(bub);
    col.appendChild(ts);
    row.appendChild(av);
    row.appendChild(col);
    wBody.appendChild(row);
    scrollDown();
  }

  /* ── Typing indicator ────────────────────────────── */
  function showTyping() {
    const row = document.createElement('div');
    row.id = 'typingRow';
    row.className = 'typing-row';

    const av = document.createElement('div');
    av.className = 'msg-av';
    av.textContent = '🤖';
    av.style.background = 'linear-gradient(135deg,#071e3d,#1e72cc)';

    const bub = document.createElement('div');
    bub.className = 'typing-bubble';
    bub.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(av);
    row.appendChild(bub);
    wBody.appendChild(row);
    scrollDown();
  }

  function hideTyping() {
    const el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  /* ── Send ────────────────────────────────────────── */
  async function doSend() {
    const text = input.value.trim();
    if (!text) return;

    killChips();
    pushMsg(text, 'user');
    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(RASA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: 'user', message: text })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      hideTyping();

      if (Array.isArray(data) && data.length > 0) {
        data.forEach(m => { if (m.text) pushMsg(m.text, 'bot'); });
      } else {
        pushMsg('عذراً، لم أفهم سؤالك. حاول مرة أخرى بصياغة مختلفة.', 'bot');
      }

    } catch (err) {
      hideTyping();
      pushMsg('⚠️ تعذّر الاتصال بالخادم. تأكد أن Rasa يعمل على المنفذ 5005.', 'bot');
      console.error('[PPU-BOT]', err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  /* ── Quick chips ─────────────────────────────────── */
  function useChip(btn) {
    input.value = btn.textContent.trim();
    doSend();
  }
</script>

</body>
</html>
